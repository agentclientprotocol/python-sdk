site_name: Agent Client Protocol - Python SDK
repo_url: https://github.com/agentclientprotocol/python-sdk
site_url: https://agentclientprotocol.github.io/python-sdk
site_description: A Python implementation of the Agent Client Protocol (ACP)
site_author: Chojan Shang
edit_uri: edit/main/docs/
repo_name: agentclientprotocol/python-sdk
copyright: Maintained by <a href="https://github.com/psiace">psiace</a>.

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Protocol Features (v1): protocol-features.md
      - Web Transport (HTTP & WebSocket): web-transport.md
      - Experimental Protocol v2: experimental-v2.md
      - Contrib Utilities: contrib.md
  - Ecosystem & Quality:
      - Use Cases: use-cases.md
      - Testing & Conformance: testing.md
      - Releasing: releasing.md
  - Migration Guides:
      - 0.11 Migration Guide: migration-guide-0.11.md
      - 0.8 Migration Guide: migration-guide-0.8.md
      - 0.7 Migration Guide: migration-guide-0.7.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/acp"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agentclientprotocol/python-sdk
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agent-client-protocol

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
